<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./images/phone-favicon.png" type="image/x-icon">
    <title>Mobile Finder</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/44c614560c.js" crossorigin="anonymous"></script>
</head>

<body class="font-poppins max-w-6xl mx-auto px-3 md:px-2">
    <header>
    <nav class="flex flex-col sm:flex-row justify-between items-center pt-3 md:pt-5">
    <!-- Logo / Title -->
    <h2 class="text-2xl font-bold mb-4 sm:mb-0">Hot Gadgets</h2>
    <!-- Button -->
     <button class="btn btn-regular w-full sm:w-auto">Sign Up</button>
    </nav>

    <!-- Banner -->
    <section class="flex flex-col justify-center items-center text-center my-12 space-y-6 "> <!-- Title --> <h2 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-bold"> Apple iPhone 13 Pro Max </h2> <!-- Description --> <p class="text-gray-700 text-sm sm:text-base md:text-lg max-w-2xl"> There are many variations of passages of Lorem Ipsum available, but the majority have suffered alteration in some form, by injected humour. </p> <!-- Button --> <button class="btn btn-regular w-full sm:w-auto"> Buy Now </button>
    <!-- banner img -->
     <div class="flex justify-center">
    <img 
    class="w-full sm:w-4/5 md:w-3/4 lg:w-[840px] h-auto rounded" 
    src="./images/banner-image.png" 
    alt="Banner Image"
  >
    </div>
    </section>
    </header>
    
    <!-- Search Your Phones -->
    <section>
      <!-- Search Filed -->
    <div>
      <!-- Title -->
     <h2 class="text-2xl sm:text-3xl md:text-4xl font-semibold text-center">
    Search your phone
     </h2>
     <!-- Search Box -->
    <div
    class="flex flex-col sm:flex-row items-center justify-between w-full sm:w-4/5 lg:w-3/5 mx-auto mt-5 lg:mt-10 bg-gray-100 rounded-full px-8 py-5 space-y-3 sm:space-y-0"
  >
    <!-- Input with icon -->
    <div class="flex items-center w-full sm:w-auto flex-grow">
      <i class="mr-2 fa-solid fa-magnifying-glass text-gray-600"></i>
      <input id="input-search"
        class="py-2 sm:py-3 w-full outline-none border-none bg-transparent"
        type="text"
        placeholder="Search your phone"
      />
    </div>
    <!-- Button -->
    <button onclick="handleSearchBtn()" id="btn-search"
      class="btn btn-regular w-full sm:w-auto"
      style="border-radius: 100px;"
    >
      Search
    </button>
  </div>
       </div>

    </section>

    <!-- Spinner -->
   <div id="spinner" class="hidden mt-5 lg:mt-10"> <div class="spinner">
   </div> 
    <p class="text-center mt-3 text-amber-600">Loading...</p>
   </div>

    <!-- Phones Container -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-10 md:mt-20" id="phones-container">
      <!-- show all phones -->
    </section>

    <!-- Show All button -->
    <div id="show-all-btn-container" class="text-center mt-5"></div>
    

   <footer class="mt-10 lg:mt-20 bg-gray-100 text-base-content rounded p-6 sm:p-10">
  <!-- Links -->
  <nav class="flex flex-col sm:flex-row justify-center items-center gap-4 text-center">
    <a class="link link-hover hover:text-[#0D6EFD]">About us</a>
    <a class="link link-hover hover:text-[#0D6EFD]">Contact</a>
    <a class="link link-hover hover:text-[#0D6EFD]">Blog</a>
    <a class="link link-hover hover:text-[#0D6EFD]">Forum</a>
  </nav>

  <!-- Social + Button -->
  <nav class="mt-6">
    <div class="flex flex-col sm:flex-row items-center justify-center gap-5">
      <div class="flex gap-5 cursor-pointer">
        <img class="w-6 h-6" src="./images/Facebook.png" alt="Facebook">
        <img class="w-6 h-6 cursor-pointer" src="./images/Twitter.png" alt="Twitter">
        <img class="w-6 h-6 cursor-pointer" src="./images/Instagram.png" alt="Instagram">
      </div>
      <button class="btn btn-regular w-full sm:w-auto mt-4 sm:mt-0">Join Premium</button>
    </div>
  </nav>

  <!-- Copyright -->
  <aside class="mt-6 text-center text-sm sm:text-base">
    <p>Copyright ©2026 - All rights reserved by Hot Gadgets</p>
  </aside>
   </footer>


    <script src="./app.js"></script>
</body>

</html>
